{% extends "base.html" %}
{% block title %}Log in — Mailer{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:60px auto 0;">
  <h1>Log in</h1>
  {% if form.errors %}<p style="color:#A3372C;font-size:13.5px;">Your username and password didn't match.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Username</label>
    <input type="text" name="username" id="id_username" required autofocus>
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit" style="margin-top:18px;width:100%;">Log in</button>
  </form>
</div>
{% endblock %}
